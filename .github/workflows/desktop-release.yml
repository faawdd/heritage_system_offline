name: Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    name: Detect offline desktop sources
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.check.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for desktop build scripts
        id: check
        shell: bash
        run: |
          if [ -f scripts/build_desktop_runtime.sh ] && [ -f scripts/build_desktop_runtime.ps1 ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "Desktop build scripts found in ${GITHUB_REF_NAME} - proceeding with desktop release."
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "::warning::scripts/build_desktop_runtime.sh/.ps1 not found in ref '${GITHUB_REF_NAME}'. Skipping desktop build."
          fi

  build:
    name: Build ${{ matrix.id }}
    needs: preflight
    if: needs.preflight.outputs.desktop == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            asset_glob: "*.exe"
            build_cmd: npx electron-builder --publish never --win nsis --x64
            artifact_name: windows-x64
          - id: linux-amd64
            os: ubuntu-24.04
            asset_glob: "*.AppImage"
            build_cmd: npx electron-builder --publish never --linux AppImage --x64
            artifact_name: linux-amd64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            asset_glob: "*.AppImage"
            build_cmd: npx electron-builder --publish never --linux AppImage --arm64
            artifact_name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 \
            sqlcipher libsqlcipher-dev pkg-config \
            libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2

      - name: Configure npm network settings
        working-directory: frontend
        shell: bash
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline true

      - name: Configure Electron download mirror
        shell: bash
        run: |
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV
          echo "ELECTRON_GET_USE_PROXY=1" >> $GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci --no-audit; then exit 0; fi
            echo "npm ci failed, retrying after delay..."
            sleep 15
          done
          exit 1

      - name: Derive app version from tag
        if: github.ref_type == 'tag'
        working-directory: frontend
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          echo "Using app version: ${APP_VERSION}"
          npm version "${APP_VERSION}" --no-git-tag-version

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Verify preloaded TianDiTu tiles
        shell: bash
        run: |
          TILE_DIR="static/tiles/tianditu"
          if [ ! -d "$TILE_DIR" ]; then
            echo "::error::Missing $TILE_DIR. Please prefetch and commit tiles before tagging release."
            exit 1
          fi
          TILE_COUNT=$(find "$TILE_DIR" -type f | wc -l | tr -d ' ')
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "::error::No tile files found under $TILE_DIR."
            exit 1
          fi
          echo "Found $TILE_COUNT TianDiTu offline tile files."

      - name: Build backend runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_desktop_runtime.ps1
        env:
          SKIP_TDT_PREFETCH: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Build backend runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/build_desktop_runtime.sh
          ./scripts/build_desktop_runtime.sh
        env:
          SKIP_TDT_PREFETCH: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Ensure desktop runtime exists for packaging
        shell: bash
        run: |
          mkdir -p desktop_runtime/app
          [ -d static ] && cp -R static desktop_runtime/app/ || true
          [ -d templates ] && cp -R templates desktop_runtime/app/ || true

      - name: Validate desktop runtime layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backendExe = "desktop_runtime\app\heritage_backend.exe"
          $frontendIndex = "desktop_runtime\app\static\frontend\index.html"
          if (-not (Test-Path $backendExe)) { throw "Missing backend executable: $backendExe" }
          if (-not (Test-Path $frontendIndex)) { throw "Missing frontend entry: $frontendIndex" }
          Write-Host "Runtime layout OK"

      - name: Validate desktop runtime layout (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f desktop_runtime/app/heritage_backend || { echo "Missing backend executable"; exit 1; }
          test -f desktop_runtime/app/static/frontend/index.html || { echo "Missing frontend entry"; exit 1; }
          echo "Runtime layout OK"

      - name: Smoke test backend executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $port = 18081
          $healthUrl = "http://127.0.0.1:$port/api/v1/health/"
          $env:BACKEND_HOST = "127.0.0.1"
          $env:BACKEND_PORT = "$port"
          $env:HERITAGE_APP_DIR = (Resolve-Path "desktop_runtime\app").Path
          $env:HERITAGE_DATA_DIR = (Join-Path $PWD ".ci-runtime\data")
          $env:HERITAGE_CONFIG_DIR = (Join-Path $PWD ".ci-runtime\config")
          $env:HERITAGE_LOG_DIR = (Join-Path $PWD ".ci-runtime\logs")
          $env:HERITAGE_BOOTSTRAP_ADMIN_PASSWORD = "Admin@123456"

          New-Item -ItemType Directory -Path $env:HERITAGE_DATA_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_CONFIG_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_LOG_DIR -Force | Out-Null

          $backendExe = (Resolve-Path "desktop_runtime\app\heritage_backend.exe").Path
          $proc = Start-Process -FilePath $backendExe -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -ge 200 -and $res.StatusCode -lt 500) {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "Backend smoke test failed: health endpoint not ready" }
            Write-Host "Backend smoke test OK"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Smoke test backend executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PORT=18081
          export BACKEND_HOST=127.0.0.1
          export BACKEND_PORT="$PORT"
          export HERITAGE_APP_DIR="$PWD/desktop_runtime/app"
          export HERITAGE_DATA_DIR="$PWD/.ci-runtime/data"
          export HERITAGE_CONFIG_DIR="$PWD/.ci-runtime/config"
          export HERITAGE_LOG_DIR="$PWD/.ci-runtime/logs"
          export HERITAGE_BOOTSTRAP_ADMIN_PASSWORD="Admin@123456"

          mkdir -p "$HERITAGE_DATA_DIR" "$HERITAGE_CONFIG_DIR" "$HERITAGE_LOG_DIR"

          "$HERITAGE_APP_DIR/heritage_backend" > "$HERITAGE_LOG_DIR/backend.stdout.log" 2> "$HERITAGE_LOG_DIR/backend.stderr.log" &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then kill "$BACKEND_PID" || true; fi
          }
          trap cleanup EXIT

          OK=0
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health/" >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 0.5
          done

          if [ "$OK" -ne 1 ]; then
            echo "Backend smoke test failed: health endpoint not ready"
            cat "$HERITAGE_LOG_DIR/backend.stderr.log" || true
            exit 1
          fi
          echo "Backend smoke test OK"

      - name: Build desktop package
        working-directory: frontend
        run: ${{ matrix.build_cmd }}

      - name: Validate packaged runtime layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backendExe = "frontend\dist-electron\win-unpacked\resources\runtime\app\heritage_backend.exe"
          $frontendIndex = "frontend\dist-electron\win-unpacked\resources\runtime\app\static\frontend\index.html"
          if (-not (Test-Path $backendExe)) { throw "Missing packaged backend executable: $backendExe" }
          if (-not (Test-Path $frontendIndex)) { throw "Missing packaged frontend entry: $frontendIndex" }
          Write-Host "Packaged runtime layout OK (Windows)"

      - name: Validate packaged runtime layout (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LINUX_UNPACKED_DIR="$(find frontend/dist-electron -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)"
          if [ -n "$LINUX_UNPACKED_DIR" ] && [ -f "$LINUX_UNPACKED_DIR/resources/runtime/app/heritage_backend" ]; then
            test -f "$LINUX_UNPACKED_DIR/resources/runtime/app/static/frontend/index.html" || { echo "Missing packaged frontend entry"; exit 1; }
            echo "Packaged runtime layout OK (Linux unpacked)"
          else
            echo "Linux unpacked runtime not found, fallback to desktop_runtime"
            test -f desktop_runtime/app/heritage_backend || { echo "Missing backend executable in desktop_runtime"; exit 1; }
            test -f desktop_runtime/app/static/frontend/index.html || { echo "Missing frontend entry in desktop_runtime"; exit 1; }
            echo "Packaged runtime layout OK (Linux desktop_runtime fallback)"
          fi

      - name: Smoke test packaged backend executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $port = 18091
          $healthUrl = "http://127.0.0.1:$port/api/v1/health/"
          $env:BACKEND_HOST = "127.0.0.1"
          $env:BACKEND_PORT = "$port"
          $env:HERITAGE_APP_DIR = (Resolve-Path "frontend\dist-electron\win-unpacked\resources\runtime\app").Path
          $env:HERITAGE_DATA_DIR = (Join-Path $PWD ".ci-packaged-runtime\data")
          $env:HERITAGE_CONFIG_DIR = (Join-Path $PWD ".ci-packaged-runtime\config")
          $env:HERITAGE_LOG_DIR = (Join-Path $PWD ".ci-packaged-runtime\logs")
          $env:HERITAGE_BOOTSTRAP_ADMIN_PASSWORD = "Admin@123456"

          New-Item -ItemType Directory -Path $env:HERITAGE_DATA_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_CONFIG_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_LOG_DIR -Force | Out-Null

          $backendExe = (Resolve-Path "frontend\dist-electron\win-unpacked\resources\runtime\app\heritage_backend.exe").Path
          $proc = Start-Process -FilePath $backendExe -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -ge 200 -and $res.StatusCode -lt 500) {
                  $ok = $true
                  break
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ok) { throw "Packaged backend smoke test failed: health endpoint not ready" }
            Write-Host "Packaged backend smoke test OK (Windows)"
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Smoke test packaged backend executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LINUX_UNPACKED_DIR="$(find frontend/dist-electron -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)"
          if [ -n "$LINUX_UNPACKED_DIR" ] && [ -f "$LINUX_UNPACKED_DIR/resources/runtime/app/heritage_backend" ]; then
            APP_RUNTIME_DIR="$PWD/$LINUX_UNPACKED_DIR/resources/runtime/app"
          else
            APP_RUNTIME_DIR="$PWD/desktop_runtime/app"
          fi

          PORT=18091
          export BACKEND_HOST=127.0.0.1
          export BACKEND_PORT="$PORT"
          export HERITAGE_APP_DIR="$APP_RUNTIME_DIR"
          export HERITAGE_DATA_DIR="$PWD/.ci-packaged-runtime/data"
          export HERITAGE_CONFIG_DIR="$PWD/.ci-packaged-runtime/config"
          export HERITAGE_LOG_DIR="$PWD/.ci-packaged-runtime/logs"
          export HERITAGE_BOOTSTRAP_ADMIN_PASSWORD="Admin@123456"

          mkdir -p "$HERITAGE_DATA_DIR" "$HERITAGE_CONFIG_DIR" "$HERITAGE_LOG_DIR"

          "$HERITAGE_APP_DIR/heritage_backend" > "$HERITAGE_LOG_DIR/backend.stdout.log" 2> "$HERITAGE_LOG_DIR/backend.stderr.log" &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then kill "$BACKEND_PID" || true; fi
          }
          trap cleanup EXIT

          OK=0
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health/" >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 0.5
          done

          if [ "$OK" -ne 1 ]; then
            echo "Packaged backend smoke test failed"
            cat "$HERITAGE_LOG_DIR/backend.stderr.log" || true
            exit 1
          fi
          echo "Packaged backend smoke test OK (Linux)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: frontend/dist-electron/${{ matrix.asset_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.desktop == 'true' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Flatten assets for Release
        run: |
          mkdir cleaned-assets
          find . -maxdepth 2 -type f \( -name "*.exe" -o -name "*.AppImage" \) -exec cp {} cleaned-assets/ \;
          echo "=== Files to be released ==="
          ls -l cleaned-assets/

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: cleaned-assets/*
          generate_release_notes: true