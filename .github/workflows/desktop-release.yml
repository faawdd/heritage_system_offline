name: Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            # 调整为相对 frontend/dist-electron 的路径，避免层级混乱
            asset_glob: "*.exe"
            build_cmd: npx electron-builder --publish never --win nsis --x64
            artifact_name: windows-x64
          - id: linux-amd64
            os: ubuntu-24.04
            asset_glob: "*.AppImage"
            build_cmd: npx electron-builder --publish never --linux AppImage --x64
            artifact_name: linux-amd64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            asset_glob: "*.AppImage"
            build_cmd: npx electron-builder --publish never --linux AppImage --arm64
            artifact_name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libasound2t64 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1 \
            sqlcipher libsqlcipher-dev pkg-config

      - name: Configure npm network settings
        working-directory: frontend
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline true

      - name: Configure Electron download mirror
        run: |
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV
          echo "ELECTRON_GET_USE_PROXY=1" >> $GITHUB_ENV

      - name: Install frontend dependencies (Linux)
        if: runner.os == 'Linux'
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci --no-audit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi
            echo "npm ci failed, retrying after short delay..."
            sleep 20
          done

      - name: Install frontend dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "npm ci attempt $attempt/3"
            npm ci --no-audit
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 3) {
              Write-Host "npm ci failed after 3 attempts"
              exit 1
            }
            Write-Host "npm ci failed, retrying after short delay..."
            Start-Sleep -Seconds 20
          }

      - name: Derive app version from tag (Linux)
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        working-directory: frontend
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          echo "Using app version: ${APP_VERSION}"
          npm version "${APP_VERSION}" --no-git-tag-version

      - name: Derive app version from tag (Windows)
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          $appVersion = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          Write-Host "Using app version: $appVersion"
          npm version $appVersion --no-git-tag-version

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Verify preloaded TianDiTu tiles (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ ! -d "static/tiles/tianditu" ]; then
            echo "Missing static/tiles/tianditu. Please prefetch and commit tiles before tagging release."
            exit 1
          fi
          TILE_COUNT=$(find static/tiles/tianditu -type f | wc -l | tr -d ' ')
          if [ "$TILE_COUNT" -eq 0 ]; then
            echo "No tile files found under static/tiles/tianditu."
            exit 1
          fi
          echo "Found $TILE_COUNT TianDiTu offline tile files."

      - name: Verify preloaded TianDiTu tiles (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "static\\tiles\\tianditu")) {
            throw "Missing static/tiles/tianditu. Please prefetch and commit tiles before tagging release."
          }
          $tileCount = (Get-ChildItem -Path "static\\tiles\\tianditu" -File -Recurse | Measure-Object).Count
          if ($tileCount -eq 0) {
            throw "No tile files found under static/tiles/tianditu."
          }
          Write-Host "Found $tileCount TianDiTu offline tile files."

      - name: Build backend runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_desktop_runtime.ps1
        env:
          SKIP_TDT_PREFETCH: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Build backend runtime (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x ./scripts/build_desktop_runtime.sh
          ./scripts/build_desktop_runtime.sh
        env:
          SKIP_TDT_PREFETCH: "1"
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_BUILDER_BINARIES_MIRROR: "https://npmmirror.com/mirrors/electron-builder-binaries/"

      - name: Ensure desktop runtime exists for packaging (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop_runtime\app")) {
            New-Item -ItemType Directory -Path "desktop_runtime\app" -Force | Out-Null
          }
          if (Test-Path "static") {
            Copy-Item -Path "static" -Destination "desktop_runtime\app" -Recurse -Force
          }
          if (Test-Path "templates") {
            Copy-Item -Path "templates" -Destination "desktop_runtime\app" -Recurse -Force
          }

      - name: Ensure desktop runtime exists for packaging (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p desktop_runtime/app
          [ -d static ] && cp -R static desktop_runtime/app/ || true
          [ -d templates ] && cp -R templates desktop_runtime/app/ || true

      - name: Build desktop package
        working-directory: frontend
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          # 核心修复：直接切入 frontend/dist-electron 目录下寻找
          path: |
            frontend/dist-electron/${{ matrix.asset_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') # 确保只有推 tag 时才跑 release，手动触发不跑

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        # 不指定 path，默认下载到当前工作目录，结构为：./<artifact_name>/<files>

      - name: Flatten assets for Release
        run: |
          mkdir cleaned-assets
          # 将各个不同平台矩阵文件夹里的最终安装包，统一复制到扁平目录中
          find . -maxdepth 2 -type f \( -name "*.exe" -o -name "*.AppImage" \) -exec cp {} cleaned-assets/ \;
          echo "=== Files to be released ==="
          ls -l cleaned-assets/

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # 发行扁平化目录下的所有文件，避免 Release 里出现套娃文件夹
          files: cleaned-assets/*
          generate_release_notes: true