name: Desktop Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            asset_glob: frontend/dist-electron/*.exe
            build_cmd: npx electron-builder --publish never --win nsis --x64
            artifact_name: windows-x64
          - id: macos-arm64
            os: macos-14
            asset_glob: |
              frontend/dist-electron/*.dmg
              frontend/dist-electron/*-mac-arm64.zip
            build_cmd: npx electron-builder --publish never --mac dmg zip --arm64
            artifact_name: macos-arm64
          - id: linux-amd64
            os: ubuntu-24.04
            asset_glob: frontend/dist-electron/*.AppImage
            build_cmd: npx electron-builder --publish never --linux AppImage --x64
            artifact_name: linux-amd64
          - id: linux-arm64
            os: ubuntu-24.04-arm
            asset_glob: frontend/dist-electron/*.AppImage
            build_cmd: npx electron-builder --publish never --linux AppImage --arm64
            artifact_name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnss3 libasound2t64 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libxkbcommon0 libxrandr2 libxcomposite1 libxdamage1

      - name: Configure npm network settings
        working-directory: frontend
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-factor 2
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set prefer-offline true

      - name: Install frontend dependencies (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: frontend
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt ${attempt}/3"
            if npm ci --no-audit; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after 3 attempts"
              exit 1
            fi

            echo "npm ci failed, retrying after short delay..."
            sleep 20
          done

      - name: Install frontend dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "npm ci attempt $attempt/3"
            npm ci --no-audit
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -eq 3) {
              Write-Host "npm ci failed after 3 attempts"
              exit 1
            }

            Write-Host "npm ci failed, retrying after short delay..."
            Start-Sleep -Seconds 20
          }

      - name: Derive app version from tag (macOS/Linux)
        if: github.ref_type == 'tag' && runner.os != 'Windows'
        working-directory: frontend
        shell: bash
        run: |
          APP_VERSION="${GITHUB_REF_NAME#v}"
          echo "Using app version: ${APP_VERSION}"
          npm version "${APP_VERSION}" --no-git-tag-version

      - name: Derive app version from tag (Windows)
        if: github.ref_type == 'tag' && runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: |
          $appVersion = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          Write-Host "Using app version: $appVersion"
          npm version $appVersion --no-git-tag-version

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Build backend runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_desktop_runtime.ps1

      - name: Build backend runtime (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./scripts/build_desktop_runtime.sh
          ./scripts/build_desktop_runtime.sh

      - name: Validate desktop runtime layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backendExe = "desktop_runtime\app\heritage_backend.exe"
          $frontendIndex = "desktop_runtime\app\static\frontend\index.html"
          if (-not (Test-Path $backendExe)) {
            throw "Missing backend executable: $backendExe"
          }
          if (-not (Test-Path $frontendIndex)) {
            throw "Missing frontend entry: $frontendIndex"
          }
          Write-Host "Runtime layout OK"

      - name: Validate desktop runtime layout (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f desktop_runtime/app/heritage_backend || { echo "Missing backend executable"; exit 1; }
          test -f desktop_runtime/app/static/frontend/index.html || { echo "Missing frontend entry"; exit 1; }
          echo "Runtime layout OK"

      - name: Smoke test backend executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $port = 18081
          $healthUrl = "http://127.0.0.1:$port/api/v1/health/"
          $env:BACKEND_HOST = "127.0.0.1"
          $env:BACKEND_PORT = "$port"
          $env:HERITAGE_APP_DIR = (Resolve-Path "desktop_runtime\app").Path
          $env:HERITAGE_DATA_DIR = (Join-Path $PWD ".ci-runtime\data")
          $env:HERITAGE_CONFIG_DIR = (Join-Path $PWD ".ci-runtime\config")
          $env:HERITAGE_LOG_DIR = (Join-Path $PWD ".ci-runtime\logs")
          $env:HERITAGE_BOOTSTRAP_ADMIN_PASSWORD = "Admin@123456"

          New-Item -ItemType Directory -Path $env:HERITAGE_DATA_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_CONFIG_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_LOG_DIR -Force | Out-Null

          $backendExe = (Resolve-Path "desktop_runtime\app\heritage_backend.exe").Path
          $proc = Start-Process -FilePath $backendExe -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -ge 200 -and $res.StatusCode -lt 500) {
                  $ok = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Milliseconds 500
            }

            if (-not $ok) {
              throw "Backend smoke test failed: health endpoint not ready"
            }
            Write-Host "Backend smoke test OK"
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Smoke test backend executable (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PORT=18081
          export BACKEND_HOST=127.0.0.1
          export BACKEND_PORT="$PORT"
          export HERITAGE_APP_DIR="$PWD/desktop_runtime/app"
          export HERITAGE_DATA_DIR="$PWD/.ci-runtime/data"
          export HERITAGE_CONFIG_DIR="$PWD/.ci-runtime/config"
          export HERITAGE_LOG_DIR="$PWD/.ci-runtime/logs"
          export HERITAGE_BOOTSTRAP_ADMIN_PASSWORD="Admin@123456"

          mkdir -p "$HERITAGE_DATA_DIR" "$HERITAGE_CONFIG_DIR" "$HERITAGE_LOG_DIR"

          "$HERITAGE_APP_DIR/heritage_backend" > "$HERITAGE_LOG_DIR/backend.stdout.log" 2> "$HERITAGE_LOG_DIR/backend.stderr.log" &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then
              kill "$BACKEND_PID" || true
            fi
          }
          trap cleanup EXIT

          OK=0
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health/" >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 0.5
          done

          if [ "$OK" -ne 1 ]; then
            echo "Backend smoke test failed: health endpoint not ready"
            echo "=== backend stderr ==="
            cat "$HERITAGE_LOG_DIR/backend.stderr.log" || true
            exit 1
          fi
          echo "Backend smoke test OK"

      - name: Build desktop package
        working-directory: frontend
        run: ${{ matrix.build_cmd }}

      - name: Validate packaged runtime layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $backendExe = "frontend\dist-electron\win-unpacked\resources\runtime\app\heritage_backend.exe"
          $frontendIndex = "frontend\dist-electron\win-unpacked\resources\runtime\app\static\frontend\index.html"
          if (-not (Test-Path $backendExe)) {
            throw "Missing packaged backend executable: $backendExe"
          }
          if (-not (Test-Path $frontendIndex)) {
            throw "Missing packaged frontend entry: $frontendIndex"
          }
          Write-Host "Packaged runtime layout OK (Windows)"

      - name: Validate packaged runtime layout (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BUNDLE="$(find frontend/dist-electron -type d -name '*.app' | head -n 1)"
          [ -n "$APP_BUNDLE" ] || { echo "No .app bundle found"; exit 1; }
          test -f "$APP_BUNDLE/Contents/Resources/runtime/app/heritage_backend" || { echo "Missing packaged backend executable"; exit 1; }
          test -f "$APP_BUNDLE/Contents/Resources/runtime/app/static/frontend/index.html" || { echo "Missing packaged frontend entry"; exit 1; }
          echo "Packaged runtime layout OK (macOS)"

      - name: Validate packaged runtime layout (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LINUX_UNPACKED_DIR="$(find frontend/dist-electron -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)"
          if [ -n "$LINUX_UNPACKED_DIR" ] && [ -f "$LINUX_UNPACKED_DIR/resources/runtime/app/heritage_backend" ]; then
            test -f "$LINUX_UNPACKED_DIR/resources/runtime/app/static/frontend/index.html" || { echo "Missing packaged frontend entry"; exit 1; }
            echo "Packaged runtime layout OK (Linux unpacked)"
          else
            echo "Linux unpacked runtime not found, fallback to desktop_runtime"
            test -f desktop_runtime/app/heritage_backend || { echo "Missing backend executable in desktop_runtime"; ls -la desktop_runtime || true; exit 1; }
            test -f desktop_runtime/app/static/frontend/index.html || { echo "Missing frontend entry in desktop_runtime"; exit 1; }
            echo "Packaged runtime layout OK (Linux desktop_runtime fallback)"
          fi

      - name: Smoke test packaged backend executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $port = 18091
          $healthUrl = "http://127.0.0.1:$port/api/v1/health/"
          $env:BACKEND_HOST = "127.0.0.1"
          $env:BACKEND_PORT = "$port"
          $env:HERITAGE_APP_DIR = (Resolve-Path "frontend\dist-electron\win-unpacked\resources\runtime\app").Path
          $env:HERITAGE_DATA_DIR = (Join-Path $PWD ".ci-packaged-runtime\data")
          $env:HERITAGE_CONFIG_DIR = (Join-Path $PWD ".ci-packaged-runtime\config")
          $env:HERITAGE_LOG_DIR = (Join-Path $PWD ".ci-packaged-runtime\logs")
          $env:HERITAGE_BOOTSTRAP_ADMIN_PASSWORD = "Admin@123456"

          New-Item -ItemType Directory -Path $env:HERITAGE_DATA_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_CONFIG_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:HERITAGE_LOG_DIR -Force | Out-Null

          $backendExe = (Resolve-Path "frontend\dist-electron\win-unpacked\resources\runtime\app\heritage_backend.exe").Path
          $proc = Start-Process -FilePath $backendExe -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $res = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 2
                if ($res.StatusCode -ge 200 -and $res.StatusCode -lt 500) {
                  $ok = $true
                  break
                }
              } catch {
              }
              Start-Sleep -Milliseconds 500
            }

            if (-not $ok) {
              throw "Packaged backend smoke test failed: health endpoint not ready"
            }
            Write-Host "Packaged backend smoke test OK (Windows)"
          }
          finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Smoke test packaged backend executable (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_BUNDLE="$(find frontend/dist-electron -type d -name '*.app' | head -n 1)"
          [ -n "$APP_BUNDLE" ] || { echo "No .app bundle found"; exit 1; }

          PORT=18091
          export BACKEND_HOST=127.0.0.1
          export BACKEND_PORT="$PORT"
          export HERITAGE_APP_DIR="$APP_BUNDLE/Contents/Resources/runtime/app"
          export HERITAGE_DATA_DIR="$PWD/.ci-packaged-runtime/data"
          export HERITAGE_CONFIG_DIR="$PWD/.ci-packaged-runtime/config"
          export HERITAGE_LOG_DIR="$PWD/.ci-packaged-runtime/logs"
          export HERITAGE_BOOTSTRAP_ADMIN_PASSWORD="Admin@123456"

          mkdir -p "$HERITAGE_DATA_DIR" "$HERITAGE_CONFIG_DIR" "$HERITAGE_LOG_DIR"

          "$HERITAGE_APP_DIR/heritage_backend" > "$HERITAGE_LOG_DIR/backend.stdout.log" 2> "$HERITAGE_LOG_DIR/backend.stderr.log" &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then
              kill "$BACKEND_PID" || true
            fi
          }
          trap cleanup EXIT

          OK=0
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health/" >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 0.5
          done

          if [ "$OK" -ne 1 ]; then
            echo "Packaged backend smoke test failed"
            cat "$HERITAGE_LOG_DIR/backend.stderr.log" || true
            exit 1
          fi
          echo "Packaged backend smoke test OK (macOS)"

      - name: Smoke test packaged backend executable (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          LINUX_UNPACKED_DIR="$(find frontend/dist-electron -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)"
          if [ -n "$LINUX_UNPACKED_DIR" ] && [ -f "$LINUX_UNPACKED_DIR/resources/runtime/app/heritage_backend" ]; then
            APP_RUNTIME_DIR="$PWD/$LINUX_UNPACKED_DIR/resources/runtime/app"
          else
            APP_RUNTIME_DIR="$PWD/desktop_runtime/app"
          fi

          PORT=18091
          export BACKEND_HOST=127.0.0.1
          export BACKEND_PORT="$PORT"
          export HERITAGE_APP_DIR="$APP_RUNTIME_DIR"
          export HERITAGE_DATA_DIR="$PWD/.ci-packaged-runtime/data"
          export HERITAGE_CONFIG_DIR="$PWD/.ci-packaged-runtime/config"
          export HERITAGE_LOG_DIR="$PWD/.ci-packaged-runtime/logs"
          export HERITAGE_BOOTSTRAP_ADMIN_PASSWORD="Admin@123456"

          mkdir -p "$HERITAGE_DATA_DIR" "$HERITAGE_CONFIG_DIR" "$HERITAGE_LOG_DIR"

          "$HERITAGE_APP_DIR/heritage_backend" > "$HERITAGE_LOG_DIR/backend.stdout.log" 2> "$HERITAGE_LOG_DIR/backend.stderr.log" &
          BACKEND_PID=$!

          cleanup() {
            if kill -0 "$BACKEND_PID" >/dev/null 2>&1; then
              kill "$BACKEND_PID" || true
            fi
          }
          trap cleanup EXIT

          OK=0
          for i in $(seq 1 80); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/v1/health/" >/dev/null 2>&1; then
              OK=1
              break
            fi
            sleep 0.5
          done

          if [ "$OK" -ne 1 ]; then
            echo "Packaged backend smoke test failed"
            cat "$HERITAGE_LOG_DIR/backend.stderr.log" || true
            exit 1
          fi
          echo "Packaged backend smoke test OK (Linux)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
