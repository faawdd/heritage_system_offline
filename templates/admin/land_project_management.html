{% load static %}
<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理查看页</title>
    <link rel="stylesheet" href="{% static 'admin/css/project_management.css' %}">
</head>
<body>
<div class="pm-wrap">
    <div class="pm-header card">
        <div class="pm-header-left">
            <h1 class="pm-title">项目管理 · 查看页</h1>
            <div class="pm-current" id="currentProjectName">当前项目：未选择</div>
        </div>
        <div class="pm-actions">
            <button class="btn btn-primary" id="btnEdit">编辑</button>
            <button class="btn" id="btnExport">导出</button>
            <button class="btn" id="btnDownloadKml">下载KML</button>
            <button class="btn" id="btnViewMap">查看地图</button>
            <button class="btn btn-danger" id="btnDelete">删除</button>
            <button class="btn" id="btnBack">返回</button>
        </div>
    </div>

    <div class="pm-layout">
        <aside class="pm-left card">
            <div class="pm-toolbar">
                <input id="searchInput" placeholder="搜索项目名 / 企业 / 来函日期(YYYY-MM-DD)">
                <select id="statusFilter"></select>
                <button class="btn btn-primary" id="btnSearch">查询</button>
            </div>
            <div class="pm-list" id="projectList"></div>
        </aside>

        <main class="pm-right">
            <section class="card pm-card">
                <div class="card-header">项目概览</div>
                <div class="card-body">
                    <div class="overview-metrics" id="metricBox"></div>
                    <div class="desc-grid" id="overviewBox"></div>
                </div>
            </section>

            <section class="card pm-card">
                <div class="card-header">审批流程</div>
                <div class="card-body">
                    <div class="flow-board" id="flowBoard"></div>
                </div>
            </section>

            <section class="card pm-card" id="gisCard">
                <div class="card-header">GIS信息</div>
                <div class="card-body">
                    <div class="desc-grid" id="gisBox"></div>
                    <div class="card-inline-actions">
                        <button class="btn" id="btnMapInline">查看地图</button>
                        <button class="btn" id="btnDownloadKmlInline">下载</button>
                        <button class="btn" id="btnGoEditInline">重新上传</button>
                    </div>
                    <div class="kml-embed-wrap">
                        <div class="kml-embed-tip" id="kmlEmbedTip">未检测到当前项目KML文件。</div>
                        <iframe id="kmlEmbedFrame" class="kml-embed-frame" title="当前项目KML叠加检查窗口" loading="lazy"></iframe>
                    </div>
                </div>
            </section>

            <section class="card pm-card">
                <div class="card-header">附件</div>
                <div class="card-body">
                    <div class="attachment-list" id="attachmentBox"></div>
                </div>
            </section>

            <section class="card pm-card">
                <div class="card-header">操作日志</div>
                <div class="card-body">
                    <div class="timeline" id="logTimeline"></div>
                </div>
            </section>
        </main>
    </div>
</div>

<script>
const STATUS_CHOICES = {{ status_choices_json|safe }};
let currentProjectId = null;
let currentDetail = null;

const el = {
    searchInput: document.getElementById('searchInput'),
    statusFilter: document.getElementById('statusFilter'),
    projectList: document.getElementById('projectList'),
    currentProjectName: document.getElementById('currentProjectName'),
    metricBox: document.getElementById('metricBox'),
    overviewBox: document.getElementById('overviewBox'),
    flowBoard: document.getElementById('flowBoard'),
    gisBox: document.getElementById('gisBox'),
    attachmentBox: document.getElementById('attachmentBox'),
    logTimeline: document.getElementById('logTimeline'),
    kmlEmbedFrame: document.getElementById('kmlEmbedFrame'),
    kmlEmbedTip: document.getElementById('kmlEmbedTip'),
};

function formatStatusLabel(raw) {
    const text = String(raw || '').trim();
    if (!text) return '-';
    if (/^\d+_/.test(text)) return text.replace(/^\d+_/, '');
    return text;
}

function statusClass(raw) {
    const s = formatStatusLabel(raw);
    if (/归档|结案|完成|已收到/.test(s)) return 'status-completed';
    if (/初审涉及|异常|驳回/.test(s)) return 'status-danger';
    if (/收文|待审核|待处理|待办/.test(s)) return 'status-pending';
    return 'status-processing';
}

function statusTag(raw) {
    const label = formatStatusLabel(raw);
    return `<span class="status-tag ${statusClass(raw)}">${label}</span>`;
}

function setStatusFilter() {
    const html = ['<option value="">全部状态</option>'];
    STATUS_CHOICES.forEach(s => html.push(`<option value="${s.value}">${formatStatusLabel(s.label || s.value)}</option>`));
    el.statusFilter.innerHTML = html.join('');
}

function gotoEditPage() {
    const query = currentProjectId ? `?project_id=${encodeURIComponent(currentProjectId)}` : '';
    window.location.href = `/admin/land-projects/edit/${query}`;
}

function buildMediaUrl(path) {
    const rawPath = String(path || '').trim();
    if (!rawPath) return '';
    const cleanPath = rawPath.replace(/^\/+/, '');
    const parts = cleanPath.split('/').filter(Boolean).map(seg => encodeURIComponent(seg));
    if (!parts.length) return '';
    return `/media/${parts.join('/')}`;
}

function buildProjectKmlFileUrl(detail) {
    return buildMediaUrl(detail && detail.kml_file_path ? detail.kml_file_path : '');
}

function renderProjectKmlEmbed(detail) {
    if (!el.kmlEmbedFrame || !el.kmlEmbedTip) return;
    const sourceKmlUrl = buildProjectKmlFileUrl(detail);
    if (!sourceKmlUrl) {
        el.kmlEmbedTip.textContent = '当前项目暂无KML文件，上传后可在此直接叠加检查。';
        el.kmlEmbedFrame.removeAttribute('src');
        return;
    }

    const sourceName = `${detail.project_name || '当前项目'}-KML`;
    const params = new URLSearchParams({
        embedded: '1',
        source_kml_url: sourceKmlUrl,
        source_kml_name: sourceName,
    });

    el.kmlEmbedTip.textContent = `当前文件：${sourceKmlUrl}`;
    const frameUrl = `/admin/kml-overlay-check/?${params.toString()}`;
    if (el.kmlEmbedFrame.src !== new URL(frameUrl, window.location.origin).toString()) {
        el.kmlEmbedFrame.src = frameUrl;
    }
}

function findKmlUploader(logs) {
    const row = (logs || []).find(l => /KML|导入/.test(String(l.action_label || l.action || '')));
    return row ? row.operator : '-';
}

function renderList(rows) {
    if (!rows.length) {
        el.projectList.innerHTML = '<div class="placeholder">暂无项目。</div>';
        return;
    }

    el.projectList.innerHTML = rows.map(r => `
        <div class="project-item ${r.id===currentProjectId ? 'active' : ''}" data-id="${r.id}">
            <div class="name">${r.project_name || '-'}</div>
            <div class="meta">${r.company_name || '-'}</div>
            <div class="meta">收文日期：${r.receive_date || '-'}</div>
            <div class="status-row">${statusTag(r.status_label || r.status)}</div>
        </div>
    `).join('');

    el.projectList.querySelectorAll('.project-item').forEach(node => {
        node.addEventListener('click', async () => {
            currentProjectId = node.dataset.id;
            await loadDetail();
            renderList(rows);
        });
    });
}

function renderOverview(d) {
    const overlap = (d.overlapped_relics_info || []).length;
    const overlapSafe = overlap === 0;

    el.metricBox.innerHTML = `
        <div class="metric-card">
            <div class="metric-title">重叠数量</div>
            <div class="metric-number ${overlapSafe ? 'safe' : 'danger'}">${overlap}</div>
            <div>${overlapSafe ? '<span class="status-tag status-completed">无重叠</span>' : '<span class="status-tag status-danger">高风险重叠</span>'}</div>
        </div>
        <div class="metric-card">
            <div class="metric-title">当前状态</div>
            <div class="metric-label">${statusTag(d.status_label || d.status)}</div>
        </div>
    `;

    const rows = [
        ['项目名称', d.project_name || '-'],
        ['企业单位', d.company_name || '-'],
        ['项目编号', d.project_code || '-'],
        ['收文编号', d.receive_doc_num || '-'],
        ['负责人', d.owner_name || '-'],
        ['联系电话', d.owner_phone || '-'],
        ['更新时间', d.updated_at || '-'],
        ['收文日期', d.receive_date || '-'],
    ];

    el.overviewBox.innerHTML = rows.map(([k, v]) => `
        <div class="desc-item">
            <div class="desc-key">${k}</div>
            <div class="desc-value">${v}</div>
        </div>
    `).join('');
}

function workflowStages() {
    return [
        { key: '10_已收文', label: '收文' },
        { key: '20_初审安全', label: 'KML导入' },
        { key: '21_CHECK_OVERLAP', label: 'AI分析' },
        { key: '30_现场勘查完成', label: '人工审核' },
        { key: '60_已结案归档', label: '完成' },
    ];
}

function renderWorkflow(d) {
    const stages = workflowStages();
    const status = String(d.status || '');
    const currentIndex = Math.max(0, stages.findIndex(s => s.key === status));

    el.flowBoard.innerHTML = stages.map((s, idx) => {
        let cls = 'pending';
        if (idx < currentIndex) cls = 'done';
        if (idx === currentIndex) cls = 'current';
        if (statusClass(d.status_label || d.status) === 'status-danger' && idx === currentIndex) cls = 'danger';
        return `<div class="flow-step ${cls}"><span>${s.label}</span></div>`;
    }).join('');
}

function renderGisInfo(d) {
    const kmlUrl = buildProjectKmlFileUrl(d);
    const rows = [
        ['KML文件', d.kml_file_path || '-'],
        ['更新时间', d.updated_at || '-'],
        ['上传人', findKmlUploader(d.operation_logs)],
        ['文件大小', '-'],
    ];

    el.gisBox.innerHTML = rows.map(([k, v]) => `
        <div class="desc-item">
            <div class="desc-key">${k}</div>
            <div class="desc-value">${v}</div>
        </div>
    `).join('');

    const download = () => {
        if (!kmlUrl) {
            alert('当前项目暂无KML文件。');
            return;
        }
        window.open(kmlUrl, '_blank');
    };

    document.getElementById('btnDownloadKmlInline').onclick = download;
    document.getElementById('btnMapInline').onclick = () => {
        if (!kmlUrl) {
            alert('当前项目暂无KML文件。');
            return;
        }
        const sourceName = `${d.project_name || '当前项目'}-KML`;
        const params = new URLSearchParams({ embedded: '1', source_kml_url: kmlUrl, source_kml_name: sourceName });
        window.open(`/admin/kml-overlay-check/?${params.toString()}`, '_blank');
    };
    document.getElementById('btnGoEditInline').onclick = gotoEditPage;
}

function renderAttachments(d) {
    const rows = [
        { type: 'PDF', path: d.archaeology_report_path, url: buildMediaUrl(d.archaeology_report_path) },
        { type: 'CAD', path: '', url: '' },
        { type: '图片', path: `${(d.field_photos || []).length} 张`, url: (d.field_photos && d.field_photos[0]) ? d.field_photos[0].photo_url : '' },
        { type: 'ZIP', path: d.misc_zip_path, url: d.misc_zip_url || '' },
    ];

    el.attachmentBox.innerHTML = rows.map(r => `
        <div class="attach-row">
            <div class="attach-type">${r.type}</div>
            <div class="attach-path">${r.path || '-'}</div>
            <div class="attach-op">${r.url ? `<a href="${r.url}" target="_blank" rel="noopener noreferrer">下载</a>` : '<span class="disabled">暂无</span>'}</div>
        </div>
    `).join('');
}

function renderLogTimeline(rows) {
    if (!rows || !rows.length) {
        el.logTimeline.innerHTML = '<div class="placeholder">暂无日志。</div>';
        return;
    }

    el.logTimeline.innerHTML = rows.map(l => `
        <div class="timeline-item">
            <div class="time">${l.created_at || '-'}</div>
            <div class="dot"></div>
            <div class="content">
                <div class="title">${l.action_label || l.action || '-'}</div>
                <div class="desc">操作人：${l.operator || '-'} | 状态：${formatStatusLabel(l.status_before || '-')} → ${formatStatusLabel(l.status_after || '-')}</div>
            </div>
        </div>
    `).join('');
}

async function loadDetail() {
    if (!currentProjectId) return;
    const resp = await fetch(`/api/land-projects/${currentProjectId}/`);
    const payload = await resp.json();
    if (!payload.success) {
        el.currentProjectName.textContent = payload.message || '加载详情失败';
        return;
    }

    currentDetail = payload.data;
    el.currentProjectName.textContent = `当前项目：${currentDetail.project_name || '-'}`;

    renderOverview(currentDetail);
    renderWorkflow(currentDetail);
    renderGisInfo(currentDetail);
    renderProjectKmlEmbed(currentDetail);
    renderAttachments(currentDetail);
    renderLogTimeline(currentDetail.operation_logs || []);
}

async function loadList() {
    const params = new URLSearchParams();
    if (el.searchInput.value.trim()) params.set('q', el.searchInput.value.trim());
    if (el.statusFilter.value) params.set('status', el.statusFilter.value);

    const resp = await fetch(`/api/land-projects/?${params.toString()}`);
    const payload = await resp.json();
    if (!payload.success) {
        el.projectList.innerHTML = `<div class="placeholder">${payload.message || '列表加载失败'}</div>`;
        return;
    }

    const rows = payload.rows || [];
    if (!currentProjectId && rows.length) currentProjectId = rows[0].id;
    renderList(rows);
    await loadDetail();
}

function bindTopActions() {
    document.getElementById('btnEdit').addEventListener('click', gotoEditPage);
    document.getElementById('btnBack').addEventListener('click', () => window.history.back());

    document.getElementById('btnDownloadKml').addEventListener('click', () => {
        if (!currentDetail) return;
        const url = buildProjectKmlFileUrl(currentDetail);
        if (!url) {
            alert('当前项目暂无KML文件。');
            return;
        }
        window.open(url, '_blank');
    });

    document.getElementById('btnViewMap').addEventListener('click', () => {
        document.getElementById('gisCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    document.getElementById('btnDelete').addEventListener('click', () => {
        alert('为保证流程合规，请在编辑页执行删除或流转相关操作。');
    });

    document.getElementById('btnExport').addEventListener('click', () => {
        if (!currentDetail) {
            alert('暂无可导出的项目数据。');
            return;
        }
        const text = JSON.stringify(currentDetail, null, 2);
        const blob = new Blob([text], { type: 'application/json;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(currentDetail.project_name || 'project').replace(/\s+/g, '_')}_detail.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
    });
}

document.getElementById('btnSearch').addEventListener('click', loadList);
el.searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') loadList(); });

(async function init() {
    setStatusFilter();
    bindTopActions();
    await loadList();
})();
</script>
</body>
</html>
