<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .header-left p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .header-right {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .nav-btn-primary {
            background: #409EFF;
            color: white;
        }

        .nav-btn-primary:hover {
            background: #66B1FF;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(64, 158, 255, 0.3);
        }

        .nav-btn-secondary {
            background: rgba(64, 158, 255, 0.1);
            color: #409EFF;
            border: 1px solid #409EFF;
        }

        .nav-btn-secondary:hover {
            background: rgba(64, 158, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            border-left: 5px solid #409EFF;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .stat-card h3 {
            color: #7f8c8d;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .number {
            font-size: 42px;
            font-weight: bold;
            color: #409EFF;
        }

        .stat-card p {
            color: #95a5a6;
            font-size: 12px;
            margin-top: 10px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .chart-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .chart-wrapper {
            position: relative;
            height: 350px;
        }

        canvas {
            max-height: 100%;
        }

        .detail-table {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .table-header {
            padding: 25px;
            border-bottom: 1px solid #f0f0f0;
        }

        .table-header h3 {
            font-size: 16px;
            color: #2c3e50;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            font-size: 13px;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 12px 15px;
            color: #555;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }

        tbody tr:hover {
            background: #f8f9fa;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #f0f0f0;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-national {
            background: #fee;
            color: #c33;
        }

        .badge-region {
            background: #fef3e6;
            color: #d97706;
        }

        .badge-county {
            background: #e6f7f0;
            color: #059669;
        }

        .badge-pending {
            background: #e6f0ff;
            color: #1d4ed8;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            padding: 20px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 20px;
            }

            .header-right {
                width: 100%;
                justify-content: center;
            }

            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1>📊 {{ title }}</h1>
                <p>鄯善县文物保护管理系统 - 数据统计</p>
            </div>
            <div class="header-right">
                <a href="/admin/heritage-map/" class="nav-btn nav-btn-secondary">🗺️ 回到地图</a>
                <a href="/admin/core/heritagesite/" class="nav-btn nav-btn-primary">📋 查看列表</a>
            </div>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>在册文物总数</h3>
                <div class="number">{{ total_sites }}</div>
                <p>✓ 已登记的不可移动文物点</p>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">📂 按分类统计</div>
                <div class="chart-wrapper">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <div class="chart-title">🏛️ 按等级统计</div>
                <div class="chart-wrapper">
                    <canvas id="levelChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 详情表格 -->
        <div class="detail-table">
            <div class="table-header">
                <h3>📈 分类详细统计</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>文物类别</th>
                        <th>数量</th>
                        <th>占比</th>
                        <th>进度</th>
                    </tr>
                </thead>
                <tbody id="categoryDetails">
                </tbody>
            </table>
        </div>

        <footer>
            <p>数据更新于：<span id="updateTime"></span> | 鄯善县文物保护管理系统</p>
        </footer>
    </div>

    <script>
        // 解析后端传来的数据
        const categoryStats = {{ category_stats_json|safe }};
        const levelStats = {{ level_stats_json|safe }};
        const totalSites = {{ total_sites }};

        // 设置更新时间
        const now = new Date();
        document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN');

        // Chart.js 全局配置
        Chart.defaults.font.family = "'Microsoft YaHei', 'Segoe UI'";

        // 分类统计图表
        const categoryCtx = document.getElementById('categoryChart').getContext('2d');
        const categoryChart = new Chart(categoryCtx, {
            type: 'doughnut',
            data: {
                labels: categoryStats.labels,
                datasets: [{
                    data: categoryStats.data,
                    backgroundColor: [
                        '#667eea',
                        '#764ba2',
                        '#f093fb',
                        '#4facfe',
                        '#00f2fe',
                        '#43e97b'
                    ],
                    borderColor: '#fff',
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            font: { size: 12 },
                            usePointStyle: true
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.parsed || 0;
                                const percentage = ((value / totalSites) * 100).toFixed(1);
                                return label + ': ' + value + ' (' + percentage + '%)';
                            }
                        }
                    }
                }
            }
        });

        // 等级统计图表
        const levelColors = {
            '全国重点文物保护单位': '#e63946',
            '自治区级文物保护单位': '#f4a261',
            '县级文物保护单位': '#2a9d8f',
            '尚未定级的不可移动文物': '#457b9d'
        };

        const levelCtx = document.getElementById('levelChart').getContext('2d');
        const levelChart = new Chart(levelCtx, {
            type: 'bar',
            data: {
                labels: levelStats.labels,
                datasets: [{
                    label: '数量',
                    data: levelStats.data,
                    backgroundColor: levelStats.labels.map(label => levelColors[label] || '#999'),
                    borderColor: 'transparent',
                    borderRadius: 8,
                    borderSkipped: false,
                    hoverBackgroundColor: [
                        '#ff6b7a',
                        '#ffbc6f',
                        '#4ab8a8',
                        '#5a8fcf'
                    ]
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const value = context.parsed.x || 0;
                                const percentage = ((value / totalSites) * 100).toFixed(1);
                                return '数量: ' + value + ' (' + percentage + '%)';
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        },
                        grid: {
                            color: 'rgba(0,0,0,0.05)'
                        }
                    },
                    y: {
                        grid: {
                            display: false
                        }
                    }
                }
            }
        });

        // 渲染分类详情表格
        function renderCategoryDetails() {
            const tbody = document.getElementById('categoryDetails');
            tbody.innerHTML = '';

            categoryStats.labels.forEach((label, index) => {
                const count = categoryStats.data[index];
                const percentage = ((count / totalSites) * 100).toFixed(1);

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${label}</td>
                    <td><strong>${count}</strong></td>
                    <td>${percentage}%</td>
                    <td>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${percentage}%"></div>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        renderCategoryDetails();
    </script>
</body>
</html>
