<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f3f6fb;
            color: #2c3e50;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* 版本号样式 */
        .version-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ddd;
            padding: 8px 12px;
            font-size: 12px;
            color: #666;
            border-radius: 4px;
            z-index: 999;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            cursor: help;
            transition: all 0.3s ease;
        }
        
        .version-badge:hover {
            color: #0c63e4;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            transform: translateY(-2px);
        }
        
        .header { max-width: 1400px; margin: 0 auto; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header, .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .header {
            padding: 18px 22px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 { font-size: 22px; }
        .header p { color: #7f8c8d; font-size: 13px; margin-top: 4px; }
        .btn {
            display: inline-block;
            text-decoration: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            border: 1px solid #409EFF;
        }
        .btn-outline { color: #409EFF; background: #fff; }
        .filters {
            padding: 16px;
            margin-bottom: 16px;
        }
        .filters h3 {
            font-size: 15px;
            margin-bottom: 12px;
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 12px;
            align-items: end;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: #606266;
            margin-bottom: 6px;
        }
        .field select, .field input {
            width: 100%;
            height: 36px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            padding: 0 10px;
            font-size: 13px;
            outline: none;
        }
        .field select:focus, .field input:focus { border-color: #409EFF; }
        .meta {
            margin-top: 10px;
            font-size: 12px;
            color: #909399;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat {
            padding: 14px;
            border-left: 4px solid #409EFF;
        }
        .stat .label { font-size: 12px; color: #909399; }
        .stat .value { font-size: 30px; font-weight: bold; color: #409EFF; margin-top: 4px; }
        .content {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 16px;
        }
        .chart-card, .table-card { padding: 16px; }
        .chart-title, .table-title { font-size: 15px; margin-bottom: 12px; }
        .chart-wrap { height: 360px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border-bottom: 1px solid #ebeef5; text-align: left; padding: 10px 8px; }
        th { color: #606266; background: #fafafa; }
        .empty { text-align: center; color: #909399; padding: 30px 0; }
        @media (max-width: 960px) {
            .content { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header card">
            <div>
                <h1>📊 {{ title }}</h1>
                <p>支持高级筛选与实时统计（含按文物点地址乡镇分类）</p>
            </div>
            <a href="/admin/heritage-map/" class="btn btn-outline">返回文物分布图</a>
        </div>

        <div class="filters card">
            <h3>高级筛选</h3>
            <div class="filter-grid">
                <div class="field">
                    <label>统计维度</label>
                    <select id="groupBy">
                        <option value="category">按文物类别</option>
                        <option value="level">按保护等级</option>
                        <option value="township">按地址乡镇</option>
                    </select>
                </div>
                <div class="field">
                    <label>坎儿井范围</label>
                    <select id="kanerjingScope">
                        <option value="all">包含坎儿井</option>
                        <option value="only">只显示坎儿井</option>
                        <option value="exclude">不包含坎儿井</option>
                    </select>
                </div>
                <div class="field">
                    <label>文物类别</label>
                    <select id="categorySelect">
                        <option value="">全部类别</option>
                    </select>
                </div>
                <div class="field">
                    <label>保护等级</label>
                    <select id="levelSelect">
                        <option value="">全部等级</option>
                    </select>
                </div>
                <div class="field">
                    <label>地址乡镇</label>
                    <select id="townshipSelect">
                        <option value="">全部乡镇</option>
                    </select>
                </div>
                <div class="field">
                    <label>地址关键词</label>
                    <input id="addressKeyword" type="text" placeholder="如：鲁克沁、城东、社区" />
                </div>
            </div>
            <div class="meta" id="lastUpdate">最后更新：--</div>
        </div>

        <div class="stats">
            <div class="stat card">
                <div class="label">筛选后文物点总数</div>
                <div class="value" id="totalCount">{{ total_sites }}</div>
            </div>
        </div>

        <div class="content">
            <div class="chart-card card">
                <div class="chart-title">统计图表</div>
                <div class="chart-wrap">
                    <canvas id="statsChart"></canvas>
                </div>
            </div>
            <div class="table-card card">
                <div class="table-title">统计明细</div>
                <table>
                    <thead>
                        <tr>
                            <th id="dimTitle">分类</th>
                            <th>数量</th>
                            <th>占比</th>
                        </tr>
                    </thead>
                    <tbody id="detailBody"></tbody>
                </table>
                <div class="empty" id="emptyState" style="display:none;">当前筛选无数据</div>
            </div>
        </div>
    </div>

    <script>
        const categoryChoices = {{ category_choices_json|safe }};
        const levelChoices = {{ level_choices_json|safe }};
        const townshipOptions = {{ township_options_json|safe }};

        const groupByEl = document.getElementById('groupBy');
        const kanerjingScopeEl = document.getElementById('kanerjingScope');
        const categoryEl = document.getElementById('categorySelect');
        const levelEl = document.getElementById('levelSelect');
        const townshipEl = document.getElementById('townshipSelect');
        const addressKeywordEl = document.getElementById('addressKeyword');
        const totalCountEl = document.getElementById('totalCount');
        const detailBodyEl = document.getElementById('detailBody');
        const emptyStateEl = document.getElementById('emptyState');
        const dimTitleEl = document.getElementById('dimTitle');
        const lastUpdateEl = document.getElementById('lastUpdate');

        let statsChart = null;
        let typingTimer = null;

        function appendOptions(selectEl, items) {
            items.forEach(item => {
                const option = document.createElement('option');
                if (Array.isArray(item)) {
                    option.value = item[0];
                    option.textContent = item[1];
                } else if (typeof item === 'object' && item !== null) {
                    option.value = item.value;
                    option.textContent = item.label;
                } else {
                    option.value = item;
                    option.textContent = item;
                }
                selectEl.appendChild(option);
            });
        }

        appendOptions(categoryEl, categoryChoices);
        appendOptions(levelEl, levelChoices);
        appendOptions(townshipEl, townshipOptions);

        function getDimensionTitle(value) {
            if (value === 'level') return '保护等级';
            if (value === 'township') return '地址乡镇';
            return '文物类别';
        }

        function renderChart(labels, data) {
            const ctx = document.getElementById('statsChart').getContext('2d');
            if (statsChart) {
                statsChart.destroy();
            }
            statsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '文物点数量',
                        data: data,
                        backgroundColor: '#409EFF'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0 } }
                    }
                }
            });
        }

        function renderTable(labels, data, total) {
            detailBodyEl.innerHTML = '';
            if (!labels.length) {
                emptyStateEl.style.display = 'block';
                return;
            }
            emptyStateEl.style.display = 'none';

            labels.forEach((label, index) => {
                const count = data[index] || 0;
                const percentage = total > 0 ? ((count / total) * 100).toFixed(1) : '0.0';
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${label}</td><td>${count}</td><td>${percentage}%</td>`;
                detailBodyEl.appendChild(tr);
            });
        }

        function buildQuery() {
            const params = new URLSearchParams({
                group_by: groupByEl.value,
                kanerjing_scope: kanerjingScopeEl.value,
                category: categoryEl.value,
                level: levelEl.value,
                township: townshipEl.value,
                address_keyword: addressKeywordEl.value.trim()
            });
            return params.toString();
        }

        function loadStats() {
            const query = buildQuery();
            fetch(`/api/heritage-classification-stats/?${query}&_=${Date.now()}`, { cache: 'no-store' })
                .then(resp => resp.json())
                .then(result => {
                    const labels = result.labels || [];
                    const data = result.data || [];
                    const total = result.total || 0;

                    dimTitleEl.textContent = getDimensionTitle(groupByEl.value);
                    totalCountEl.textContent = total;
                    renderChart(labels, data);
                    renderTable(labels, data, total);
                    lastUpdateEl.textContent = '最后更新：' + new Date().toLocaleString('zh-CN');
                })
                .catch(() => {
                    detailBodyEl.innerHTML = '';
                    emptyStateEl.style.display = 'block';
                });
        }

        function bindChangeEvents() {
            [groupByEl, kanerjingScopeEl, categoryEl, levelEl, townshipEl].forEach(el => {
                el.addEventListener('change', loadStats);
            });
            addressKeywordEl.addEventListener('input', function () {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(loadStats, 300);
            });
        }

        bindChangeEvents();
        loadStats();
    </script>
    
    <!-- 版本号显示 -->
    <div class="version-badge" title="最后更新时间：{{ SYS_VERSION_UPDATED_AT|default:'未知' }}">
        {{ SYS_VERSION }}
    </div>
</body>
</html>
