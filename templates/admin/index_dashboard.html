<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鄯善县文物数字化管理平台 - 首页</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card.total {
            border-top: 4px solid #409EFF;
        }

        .stat-card.national {
            border-top: 4px solid #E6A23C;
        }

        .stat-card.regional {
            border-top: 4px solid #67C26A;
        }

        .stat-card.county {
            border-top: 4px solid #F56C6C;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #409EFF;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 14px;
            color: #7f8c8d;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chart-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .chart-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 16px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h1>📊 文物数据统计概览</h1>
            <p>鄯善县不可移动文物实时数据展示</p>
        </div>

        <!-- 设备检测和移动端导航 -->
        <div style="background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: none;" id="mobile-notice">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 18px;">📱</span>
                <div>
                    <div style="font-weight: 600; color: #2c3e50;">检测到移动设备</div>
                    <div style="font-size: 13px; color: #7f8c8d; margin-top: 3px;">建议使用手机端界面以获得更好体验</div>
                </div>
                <a href="/mobile/add/" style="margin-left: auto; padding: 8px 15px; background: #667eea; color: white; border-radius: 4px; text-decoration: none; font-size: 13px; font-weight: 600;">前往手机版</a>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-label">文物总数</div>
                <div class="stat-number" id="total-count">--</div>
                <div class="stat-label">记录在案</div>
            </div>
            <div class="stat-card national">
                <div class="stat-label">国家级</div>
                <div class="stat-number" id="national-count">--</div>
                <div class="stat-label">全国重点</div>
            </div>
            <div class="stat-card regional">
                <div class="stat-label">自治区级</div>
                <div class="stat-number" id="regional-count">--</div>
                <div class="stat-label">区级保护</div>
            </div>
            <div class="stat-card county">
                <div class="stat-label">县级</div>
                <div class="stat-number" id="county-count">--</div>
                <div class="stat-label">县级保护</div>
            </div>
            <div class="stat-card kanerjing" style="border-top-color: #E6A23C;">
                <div class="stat-label">坎儿井</div>
                <div class="stat-number" id="kanerjing-count" style="color: #E6A23C;">--</div>
                <div class="stat-label">个</div>
            </div>
        </div>

        <div class="charts-section">
            <div class="chart-card">
                <h3>📈 按保护等级分布</h3>
                <div class="chart-container">
                    <canvas id="levelChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>📊 按文物类别分布</h3>
                <div class="chart-container">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let levelChart = null;
        let categoryChart = null;

        // 从后端获取统计数据
        function loadStats() {
            fetch('/api/heritage-stats/')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('total-count').textContent = data.total || 0;
                    document.getElementById('national-count').textContent = data.national || 0;
                    document.getElementById('regional-count').textContent = data.regional || 0;
                    document.getElementById('county-count').textContent = data.county || 0;
                })
                .catch(err => console.error('无法加载统计数据', err));
            
            // 加载坎儿井统计
            fetch('/api/kanerjing-stats/')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('kanerjing-count').textContent = data.total || 0;
                })
                .catch(err => console.error('无法加载坎儿井数据', err));
        }

        // 获取并绘制等级分布图表
        function loadLevelChart() {
            fetch('/api/heritage-stats/')
                .then(r => r.json())
                .then(data => {
                    const ctx = document.getElementById('levelChart').getContext('2d');
                    if (levelChart) levelChart.destroy();
                    levelChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['国家级', '自治区级', '县级'],
                            datasets: [{
                                data: [data.national || 0, data.regional || 0, data.county || 0],
                                backgroundColor: ['#E6A23C', '#67C26A', '#F56C6C'],
                                borderColor: '#fff',
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                }
                            }
                        }
                    });
                })
                .catch(err => console.error('无法加载等级图表', err));
        }

        // 获取并绘制类别分布图表
        function loadCategoryChart() {
            // 从仪表板端点获取详细的分类数据
            // 如果没有专门的端点，可以显示一个提示
            const ctx = document.getElementById('categoryChart').getContext('2d');
            if (categoryChart) categoryChart.destroy();
            categoryChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['古建筑', '古遗址', '古墓葬', '石刻', '其他'],
                    datasets: [{
                        label: '文物数量',
                        data: [0, 0, 0, 0, 0],
                        backgroundColor: '#409EFF',
                        borderColor: '#409EFF',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: {
                        legend: {
                            display: false,
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1
                            }
                        }
                    }
                }
            });
            
            // 动态加载类别数据
            loadCategoryData();
        }

        // 加载类别详细数据
        function loadCategoryData() {
            fetch('/api/heritage-stats-by-category/')
                .then(r => r.json())
                .then(data => {
                    if (categoryChart && data.labels && data.data) {
                        categoryChart.data.labels = data.labels;
                        categoryChart.data.datasets[0].data = data.data;
                        categoryChart.update();
                    }
                })
                .catch(err => {
                    // 如果没有这个端点，忽略错误
                    console.log('类别数据不可用');
                });
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadLevelChart();
            loadCategoryChart();
            
            // 设备检测：显示移动端提示
            detectDeviceAndShowNotice();
        });

        // 设备检测函数
        function detectDeviceAndShowNotice() {
            const userAgent = navigator.userAgent.toLowerCase();
            const mobileKeywords = ['android', 'iphone', 'ipod', 'blackberry', 'windows phone', 'opera mini', 'mobile', 'phone', 'webos', 'small'];
            const isMobile = mobileKeywords.some(keyword => userAgent.includes(keyword));
            
            // 排除平板设备
            const isTablet = (userAgent.includes('ipad') || userAgent.includes('tablet')) && !userAgent.includes('mobile');
            
            if (isMobile && !isTablet) {
                // 显示移动端提示
                const noticeEl = document.getElementById('mobile-notice');
                if (noticeEl) {
                    noticeEl.style.display = 'block';
                }
            }
        }
    </script>
</body>
</html>
