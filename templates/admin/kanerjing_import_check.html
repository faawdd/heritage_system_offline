<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坎儿井导入检查报告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .report-header {
            background: white;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
            border-left: 4px solid #67C26A;
        }

        .report-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .report-header p {
            color: #7f8c8d;
            font-size: 14px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-box h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #67C26A;
            margin: 15px 0;
        }

        .stat-percent {
            font-size: 14px;
            color: #999;
        }

        .action-box {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .action-box h3 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            margin: 0 10px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #67C26A;
            color: white;
        }

        .btn-primary:hover {
            background: #55a052;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(103, 194, 106, 0.3);
        }

        .btn-secondary {
            background: #409EFF;
            color: white;
        }

        .btn-secondary:hover {
            background: #0d5cdb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(64, 158, 255, 0.3);
        }

        .info-box {
            background: #f0f9ff;
            border: 1px solid #b3e5fc;
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            color: #01579b;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="report-header">
            <h1>📋 坎儿井导入检查报告</h1>
            <p>数据库中自动识别名称包含"坎儿井"的文物</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <h3>坎儿井总数</h3>
                <div class="stat-number">{{ kanerjing_count }}</div>
                <div class="stat-percent">处</div>
            </div>
            <div class="stat-box">
                <h3>文物总数</h3>
                <div class="stat-number">{{ total_count }}</div>
                <div class="stat-percent">处</div>
            </div>
        </div>

        <div class="stat-box" style="margin-bottom: 20px;">
            <h3>坎儿井占比</h3>
            <div class="stat-number" style="color: #E6A23C;">{{ kanerjing_percentage }}%</div>
            <div class="stat-percent">占全部文物比例</div>
        </div>

        <div class="action-box">
            <h3>📌 快速操作</h3>
            <a href="/admin/core/heritagesite/?is_kanerjing=yes" class="btn btn-primary">查看所有坎儿井</a>
            <a href="/admin/kanerjing/" class="btn btn-secondary">坎儿井管理页面</a>
        </div>

        <div class="info-box">
            <strong>⚠️ 说明：</strong> 坎儿井是通过搜索文物名称中包含"坎儿井"关键词自动识别的。
            您可以在文物列表中使用"坎儿井过滤"快速筛选所有坎儿井记录。
            导入新数据时，名称中包含"坎儿井"的文物会自动被标记和识别。
        </div>
    </div>
</body>
</html>
