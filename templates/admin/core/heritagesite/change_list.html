{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <a href="javascript:void(0);" id="toggle-edit-mode" class="historylink">进入编辑模式</a>
    </li>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .readonly-row input[disabled],
        .readonly-row select[disabled],
        .readonly-row textarea[disabled] {
            background: #f5f7fa;
            color: #909399;
            cursor: not-allowed;
            border-color: #e4e7ed;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggleBtn = document.getElementById('toggle-edit-mode');
            if (!toggleBtn) {
                return;
            }

            let form = document.getElementById('changelist-form');
            if (!form) {
                const anyEditableField = document.querySelector('input[name^="form-"], select[name^="form-"], textarea[name^="form-"]');
                if (anyEditableField) {
                    form = anyEditableField.closest('form');
                }
            }
            if (!form) {
                return;
            }

            let editModeInput = form.querySelector('input[name="edit_mode"]');
            if (!editModeInput) {
                editModeInput = document.createElement('input');
                editModeInput.type = 'hidden';
                editModeInput.name = 'edit_mode';
                editModeInput.value = '0';
                form.appendChild(editModeInput);
            }

            const saveButtons = form.querySelectorAll('input[name="_save"], button[name="_save"]');
            let isEditMode = false;

            function toggleEditable(enabled) {
                const editableInputs = form.querySelectorAll('input[name^="form-"] , select[name^="form-"] , textarea[name^="form-"]');
                editableInputs.forEach(function (el) {
                    if (el.type === 'hidden') {
                        return;
                    }
                    el.disabled = !enabled;
                });

                saveButtons.forEach(function (btn) {
                    btn.disabled = !enabled;
                    btn.style.opacity = enabled ? '1' : '0.6';
                    btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
                });

                if (enabled) {
                    form.classList.remove('readonly-row');
                    toggleBtn.textContent = '退出编辑模式';
                    toggleBtn.classList.add('deletelink');
                    editModeInput.value = '1';
                } else {
                    form.classList.add('readonly-row');
                    toggleBtn.textContent = '进入编辑模式';
                    toggleBtn.classList.remove('deletelink');
                    editModeInput.value = '0';
                }
            }

            toggleBtn.addEventListener('click', function (event) {
                event.preventDefault();
                isEditMode = !isEditMode;
                toggleEditable(isEditMode);
            });

            toggleEditable(false);
        });
    </script>
{% endblock %}
