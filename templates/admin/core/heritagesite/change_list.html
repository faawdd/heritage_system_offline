{% extends "admin/change_list.html" %}

{% block content %}
    <div id="heritage-edit-mode-toolbar" style="margin-bottom:20px;padding:15px;background:#f8f9fa;border-radius:4px;border:1px solid #e9ecef;">
        <button id="toggle-edit-mode" type="button" class="button" style="padding:8px 16px;font-size:14px;cursor:pointer;">进入编辑模式</button>
        <span id="mode-status-badge" style="display:inline-block;padding:6px 12px;border-radius:4px;background:#f4f4f5;color:#606266;font-size:12px;margin-left:15px;">当前模式：查看</span>
    </div>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .readonly-row input[disabled],
        .readonly-row select[disabled],
        .readonly-row textarea[disabled] {
            background: #f5f7fa;
            color: #909399;
            cursor: not-allowed;
            border-color: #e4e7ed;
        }

        .mode-status-view {
            background: #f4f4f5 !important;
            color: #606266 !important;
        }

        .mode-status-edit {
            background: #ecf5ff !important;
            color: #409eff !important;
        }

        .edit-name-link {
            color: #409eff;
            text-decoration: none;
            font-weight: 600;
        }

        .edit-name-link:hover {
            text-decoration: underline;
        }
    </style>
    <script>
        (function () {
            let isEditMode = false;

            function findForm() {
                // Django admin 的列表编辑表单 ID
                return document.getElementById('changelist-form');
            }

            function applyMode(enabled) {
                const form = findForm();
                if (!form) {
                    console.error('[HeritageEdit] changelist-form not found');
                    return false;
                }

                // 处理隐藏的编辑模式标志
                let editModeInput = form.querySelector('input[name="edit_mode"]');
                if (!editModeInput) {
                    editModeInput = document.createElement('input');
                    editModeInput.type = 'hidden';
                    editModeInput.name = 'edit_mode';
                    form.appendChild(editModeInput);
                }

                // 启用/禁用所有可编辑的表单字段
                const editableInputs = form.querySelectorAll('input[name^="form-"], select[name^="form-"], textarea[name^="form-"]');
                editableInputs.forEach(function (el) {
                    if (el.type === 'hidden' || el.type === 'checkbox') {
                        return;
                    }
                    el.disabled = !enabled;
                });

                // 更新保存按钮状态
                const saveBtn = form.querySelector('input[name="_save"]');
                if (saveBtn) {
                    saveBtn.disabled = !enabled;
                    saveBtn.style.opacity = enabled ? '1' : '0.5';
                    saveBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';
                }

                // 更新 UI
                const toggleBtn = document.getElementById('toggle-edit-mode');
                const modeStatusBadge = document.getElementById('mode-status-badge');

                if (enabled) {
                    editModeInput.value = '1';
                    if (toggleBtn) {
                        toggleBtn.textContent = '退出编辑模式';
                        toggleBtn.className = 'button deletelink';
                    }
                    if (modeStatusBadge) {
                        modeStatusBadge.textContent = '当前模式：编辑 ✏️';
                        modeStatusBadge.style.background = '#ecf5ff';
                        modeStatusBadge.style.color = '#409eff';
                    }
                    console.log('[HeritageEdit] Edit mode activated');
                } else {
                    editModeInput.value = '0';
                    if (toggleBtn) {
                        toggleBtn.textContent = '进入编辑模式';
                        toggleBtn.className = 'button';
                    }
                    if (modeStatusBadge) {
                        modeStatusBadge.textContent = '当前模式：查看';
                        modeStatusBadge.style.background = '#f4f4f5';
                        modeStatusBadge.style.color = '#606266';
                    }
                    console.log('[HeritageEdit] View mode activated');
                }

                return true;
            }

            // 初始化函数
            function init() {
                const toggleBtn = document.getElementById('toggle-edit-mode');
                
                if (!toggleBtn) {
                    console.error('[HeritageEdit] toggle-edit-mode button not found - will retry');
                    setTimeout(init, 100);
                    return;
                }

                console.log('[HeritageEdit] Button found, attaching click handler');

                // 移除之前的事件监听器（如果有的话）
                toggleBtn.onclick = null;

                // 添加点击事件
                toggleBtn.addEventListener('click', function (event) {
                    event.preventDefault();
                    console.log('[HeritageEdit] Button clicked, current mode:', isEditMode);
                    isEditMode = !isEditMode;
                    applyMode(isEditMode);
                });

                // 初始化为查看模式
                applyMode(false);

                // 暴露全局函数用于调试
                window.toggleHeritageEditMode = function () {
                    console.log('[HeritageEdit] Global function called');
                    isEditMode = !isEditMode;
                    applyMode(isEditMode);
                };

                console.log('[HeritageEdit] Initialization complete');
            }

            // 确保 DOM 加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
{% endblock %}
