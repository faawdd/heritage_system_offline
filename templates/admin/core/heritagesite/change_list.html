{% extends "admin/change_list.html" %}

{% block content %}
    <div id="heritage-edit-mode-toolbar" style="margin-bottom:20px;padding:15px;background:#f8f9fa;border-radius:4px;border:1px solid #e9ecef;">
        <button id="toggle-edit-mode" type="button" class="button" style="padding:8px 16px;font-size:14px;cursor:pointer;">进入编辑模式</button>
        <span id="mode-status-badge" style="display:inline-block;padding:6px 12px;border-radius:4px;background:#f4f4f5;color:#606266;font-size:12px;margin-left:15px;">当前模式：查看</span>
    </div>
    {{ block.super }}
{% endblock %}

{% block extrahead %}
    {{ block.super }}
    <style>
        .readonly-row input[disabled],
        .readonly-row select[disabled],
        .readonly-row textarea[disabled] {
            background: #f5f7fa;
            color: #909399;
            cursor: not-allowed;
            border-color: #e4e7ed;
        }

        .mode-status-view {
            background: #f4f4f5 !important;
            color: #606266 !important;
        }

        .mode-status-edit {
            background: #ecf5ff !important;
            color: #409eff !important;
        }

        .edit-name-link {
            color: #409eff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .edit-name-link:hover {
            text-decoration: underline;
            color: #66b1ff;
        }

        /* 查看模式下的链接样式 */
        .edit-name-link.view-mode {
            color: #606266;
            font-weight: normal;
            cursor: pointer;
        }

        .edit-name-link.view-mode:hover {
            color: #409eff;
            text-decoration: underline;
        }

        /* 编辑模式下的链接样式 */
        .edit-name-link.edit-mode {
            color: #409eff;
            font-weight: 600;
        }

        .edit-name-link.edit-mode:hover {
            color: #66b1ff;
            text-decoration: underline;
        }

        /* 编辑模式下的行高亮效果 */
        #result_list tbody tr:hover {
            background-color: #f5f7ff;
        }

        /* "编辑"按钮样式 */
        .edit-button-cell .button {
            display: inline-block;
            padding: 5px 12px !important;
            background-color: #409eff !important;
            color: white !important;
            text-decoration: none !important;
            border-radius: 3px !important;
            border: none !important;
            font-size: 12px !important;
            cursor: pointer !important;
            transition: background-color 0.2s ease;
        }

        .edit-button-cell .button:hover {
            background-color: #66b1ff !important;
        }

        .edit-button-cell .button:active {
            background-color: #0a66c2 !important;
        }

        /* 表头样式-编辑模式 */
        #result_list thead th {
            padding: 10px 5px;
        }

        /* 编辑模式下的行内间距 */
        #result_list tbody td {
            vertical-align: middle;
        }
    </style>
    <script>
        (function () {
            let isEditMode = false;
            let linksInitialized = false; // 标记是否已初始化过链接

            function getAdminBaseURL() {
                // 获取 admin 基础 URL
                const pathParts = window.location.pathname.split('/');
                // 通常是 /admin/...
                const adminIndex = pathParts.indexOf('admin');
                if (adminIndex !== -1) {
                    return pathParts.slice(0, adminIndex + 1).join('/');
                }
                return '/admin';
            }

            function findForm() {
                return document.getElementById('changelist-form');
            }

            function initializeNameLinks(form) {
                // 初始化时为所有名称添加超链接（只执行一次）
                if (linksInitialized) {
                    return;
                }

                const table = form.querySelector('#result_list');
                if (!table) {
                    console.warn('[HeritageEdit] Table #result_list not found');
                    return;
                }

                const rows = table.querySelectorAll('tbody tr');
                const baseURL = getAdminBaseURL();

                rows.forEach(function (row) {
                    const checkbox = row.querySelector('input[type="checkbox"].action-select');
                    if (!checkbox || !checkbox.value) {
                        return;
                    }

                    const objectId = checkbox.value;
                    const nameCell = row.querySelector('td.field-name');

                    if (!nameCell) {
                        return;
                    }

                    // 检查是否已有链接
                    let nameLink = nameCell.querySelector('a.edit-name-link');
                    if (!nameLink) {
                        const nameText = nameCell.textContent.trim();

                        nameLink = document.createElement('a');
                        nameLink.href = baseURL + '/core/heritagesite/' + objectId + '/change/';
                        nameLink.className = 'edit-name-link view-mode';
                        nameLink.textContent = nameText;
                        nameLink.title = '点击打开详情页查看更多信息';

                        nameCell.innerHTML = '';
                        nameCell.appendChild(nameLink);
                    }
                });

                linksInitialized = true;
                console.log('[HeritageEdit] Name links initialized');
            }

            function updateEditMode(form, enabled) {
                // 更新编辑模式UI和交互
                const table = form.querySelector('#result_list');
                if (!table) {
                    return;
                }

                const rows = table.querySelectorAll('tbody tr');
                const baseURL = getAdminBaseURL();

                rows.forEach(function (row) {
                    const checkbox = row.querySelector('input[type="checkbox"].action-select');
                    if (!checkbox || !checkbox.value) {
                        return;
                    }

                    const objectId = checkbox.value;
                    const nameCell = row.querySelector('td.field-name');
                    const nameLink = nameCell ? nameCell.querySelector('a.edit-name-link') : null;
                    let editButtonCell = row.querySelector('td.edit-button-cell');

                    // 更新名称链接的类名和提示
                    if (nameLink) {
                        if (enabled) {
                            nameLink.className = 'edit-name-link edit-mode';
                            nameLink.title = '点击打开详情页编辑所有字段';
                        } else {
                            nameLink.className = 'edit-name-link view-mode';
                            nameLink.title = '点击打开详情页查看更多信息';
                        }
                    }

                    // 处理编辑按钮的显示/隐藏
                    if (enabled) {
                        // 进入编辑模式：显示编辑按钮
                        if (!editButtonCell) {
                            editButtonCell = document.createElement('td');
                            editButtonCell.className = 'edit-button-cell';
                            editButtonCell.style.textAlign = 'center';
                            editButtonCell.style.padding = '8px';

                            const editBtn = document.createElement('a');
                            editBtn.href = baseURL + '/core/heritagesite/' + objectId + '/change/';
                            editBtn.className = 'button edit-button';
                            editBtn.textContent = '编辑';
                            editBtn.title = '编辑此文物点的所有信息';

                            editButtonCell.appendChild(editBtn);
                            row.appendChild(editButtonCell);
                        }
                    } else {
                        // 退出编辑模式：隐藏编辑按钮
                        if (editButtonCell) {
                            editButtonCell.remove();
                        }
                    }
                });

                console.log('[HeritageEdit] Edit mode updated:', enabled);
            }

            function applyMode(enabled) {
                const form = findForm();
                if (!form) {
                    console.error('[HeritageEdit] changelist-form not found');
                    return false;
                }

                // 处理隐藏的编辑模式标志
                let editModeInput = form.querySelector('input[name="edit_mode"]');
                if (!editModeInput) {
                    editModeInput = document.createElement('input');
                    editModeInput.type = 'hidden';
                    editModeInput.name = 'edit_mode';
                    form.appendChild(editModeInput);
                }

                // 启用/禁用所有可编辑的表单字段
                const editableInputs = form.querySelectorAll('input[name^="form-"], select[name^="form-"], textarea[name^="form-"]');
                editableInputs.forEach(function (el) {
                    if (el.type === 'hidden' || el.type === 'checkbox') {
                        return;
                    }
                    el.disabled = !enabled;
                });

                // 更新保存按钮状态
                const saveBtn = form.querySelector('input[name="_save"]');
                if (saveBtn) {
                    saveBtn.disabled = !enabled;
                    saveBtn.style.opacity = enabled ? '1' : '0.5';
                    saveBtn.style.cursor = enabled ? 'pointer' : 'not-allowed';
                }

                // 初始化链接（首次）
                initializeNameLinks(form);

                // 更新编辑模式UI
                updateEditMode(form, enabled);

                // 更新状态徽章和按钮
                const toggleBtn = document.getElementById('toggle-edit-mode');
                const modeStatusBadge = document.getElementById('mode-status-badge');

                if (enabled) {
                    editModeInput.value = '1';
                    if (toggleBtn) {
                        toggleBtn.textContent = '退出编辑模式';
                        toggleBtn.className = 'button deletelink';
                    }
                    if (modeStatusBadge) {
                        modeStatusBadge.textContent = '当前模式：编辑 ✏️ - 点击名称或"编辑"按钮编辑全部内容';
                        modeStatusBadge.style.background = '#ecf5ff';
                        modeStatusBadge.style.color = '#409eff';
                    }
                    console.log('[HeritageEdit] Edit mode activated');
                } else {
                    editModeInput.value = '0';
                    if (toggleBtn) {
                        toggleBtn.textContent = '进入编辑模式';
                        toggleBtn.className = 'button';
                    }
                    if (modeStatusBadge) {
                        modeStatusBadge.textContent = '当前模式：查看 - 点击文物名称查看详情';
                        modeStatusBadge.style.background = '#f4f4f5';
                        modeStatusBadge.style.color = '#606266';
                    }
                    console.log('[HeritageEdit] View mode activated');
                }

                return true;
            }

            // 初始化函数
            function init() {
                const toggleBtn = document.getElementById('toggle-edit-mode');
                
                if (!toggleBtn) {
                    console.error('[HeritageEdit] toggle-edit-mode button not found - will retry');
                    setTimeout(init, 100);
                    return;
                }

                console.log('[HeritageEdit] Button found, attaching click handler');

                // 移除之前的事件监听器（如果有的话）
                toggleBtn.onclick = null;

                // 添加点击事件
                toggleBtn.addEventListener('click', function (event) {
                    event.preventDefault();
                    console.log('[HeritageEdit] Button clicked, current mode:', isEditMode);
                    isEditMode = !isEditMode;
                    applyMode(isEditMode);
                });

                // 初始化为查看模式
                applyMode(false);

                // 暴露全局函数用于调试
                window.toggleHeritageEditMode = function () {
                    console.log('[HeritageEdit] Global function called');
                    isEditMode = !isEditMode;
                    applyMode(isEditMode);
                };

                console.log('[HeritageEdit] Initialization complete');
            }

            // 确保 DOM 加载完成后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
{% endblock %}
