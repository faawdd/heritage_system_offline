{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鄯善县不可移动文物采集</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'public/css/heritage_collect.css' %}?v={{ SYS_VERSION }}" />
</head>
<body class="min-h-screen pb-10">

  <!-- ══ 顶部导航栏 ══ -->
  <header class="sticky top-0 z-50 bg-blue-700 text-white shadow-md">
    <div class="flex items-center justify-between px-4 py-3 max-w-2xl mx-auto">
      <button onclick="history.back()" class="p-1 -ml-1 rounded-lg active:bg-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-base font-semibold tracking-wide">鄯善县不可移动文物采集</h1>
      <div class="w-8"></div>
    </div>
  </header>

  <main class="collect-main mx-auto px-4 pt-5 space-y-0">

    <!-- ══ 进度提示 ══ -->
    <div id="progress-hint" data-layout-span="full" class="text-xs text-slate-500 flex items-center gap-1.5">
      <span class="inline-block w-2 h-2 bg-blue-500 rounded-full"></span>
      带 <span class="text-red-500 font-bold">*</span> 为必填项，经纬度需点击下方按钮自动获取
    </div>

    <!-- ══ 卡片：基础信息 ══ -->
    <section class="collect-section space-y-4">
      <h2 class="text-sm font-semibold text-slate-700 border-b border-slate-100 pb-2 flex items-center gap-2">
        <span class="w-1 h-4 bg-blue-500 rounded-full"></span>基础信息
      </h2>

      <!-- 采集编号 -->
      <div>
        <label class="block text-sm text-slate-600 mb-1">采集编号（可留空自动生成）</label>
        <input id="survey_code" name="survey_code" type="text" placeholder="留空自动生成，如：SS-CJ-2026-0001"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        <p id="err-survey_code" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- 文物名称 -->
      <div>
        <label class="block text-sm text-slate-600 mb-1 required-mark">文物名称</label>
        <input id="name" name="name" type="text" placeholder="请输入文物标准名称"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        <p id="err-name" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- 曾用名 -->
      <div>
        <label class="block text-sm text-slate-600 mb-1">曾用名 / 别名</label>
        <input id="former_name" name="former_name" type="text" placeholder="（选填）"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
      </div>

      <!-- 时代 + 文物类别 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-slate-600 mb-1 required-mark">时代</label>
          <input id="era" name="era" type="text" placeholder="如：汉、唐宋"
                 class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
          <p id="err-era" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1 required-mark">文物类别</label>
          <select id="category" name="category"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
            <option value="">请选择</option>
            {% for value, label in category_choices %}
              <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
          <p id="err-category" class="text-red-500 text-xs mt-1 hidden"></p>
        </div>
      </div>

      <div>
        <label class="block text-sm text-slate-600 mb-1">文物类型</label>
        <select id="heritage_type" name="heritage_type"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
          <option value="">请选择（选填）</option>
          {% for value, label in heritage_type_choices %}
            <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </section>

    <!-- ══ 卡片：地理位置 ══ -->
    <section class="collect-section space-y-4">
      <h2 class="text-sm font-semibold text-slate-700 border-b border-slate-100 pb-2 flex items-center gap-2">
        <span class="w-1 h-4 bg-green-500 rounded-full"></span>地理位置
      </h2>

      <!-- GPS 获取按钮 -->
      <div class="flex items-center gap-3">
        <button id="btn-gps" onclick="fetchLocation()"
                class="flex items-center gap-2 bg-green-600 hover:bg-green-700 active:bg-green-800
                       text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            <circle cx="12" cy="12" r="9" stroke-dasharray="2 4"/>
          </svg>
          <span id="btn-gps-text">获取当前位置</span>
        </button>
        <span id="gps-status" class="gps-badge idle">未定位</span>
      </div>
      <p id="err-location" class="text-red-500 text-xs -mt-2 hidden"></p>

      <!-- 经纬度展示 -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">经度 (Longitude)</label>
          <input id="longitude" name="longitude" type="text" readonly placeholder="—"
                 class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-green-50 text-green-800 font-mono" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">纬度 (Latitude)</label>
          <input id="latitude" name="latitude" type="text" readonly placeholder="—"
                 class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-green-50 text-green-800 font-mono" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">坐标系</label>
          <select id="coordinate_system" name="coordinate_system"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
            {% for value, label in coordinate_system_choices %}
              <option value="{{ value }}" {% if value == "CGCS2000" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">海拔高程（米）</label>
          <input id="altitude" name="altitude" type="number" step="0.01" placeholder="（选填）"
                 class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">精度（米）</label>
          <input id="accuracy" type="text" readonly placeholder="—"
                 class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm bg-slate-50 text-slate-500" />
        </div>
      </div>

      <div>
        <label class="block text-sm text-slate-600 mb-1">占地面积（平方米）</label>
        <input id="area" name="area" type="number" step="0.01" min="0" placeholder="（选填）"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        <p id="err-area" class="text-red-500 text-xs mt-1 hidden"></p>
      </div>

      <!-- 行政区划 -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs text-slate-500 mb-1">省/自治区</label>
          <input id="province" name="province" type="text" placeholder="省级"
                 class="w-full border border-slate-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">市/州</label>
          <input id="city" name="city" type="text" placeholder="市级"
                 class="w-full border border-slate-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">县/市/区</label>
          <input id="county" name="county" type="text" placeholder="县级"
                 class="w-full border border-slate-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">乡镇/街道</label>
          <input id="township" name="township" type="text" placeholder="（选填）"
                 class="w-full border border-slate-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">村/社区</label>
          <input id="village" name="village" type="text" placeholder="（选填）"
                 class="w-full border border-slate-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-600 mb-1">详细地址</label>
        <input id="address" name="address" type="text" placeholder="精确到自然地标或门牌号"
               class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" />
      </div>
    </section>

    <!-- ══ 卡片：保存状况与权属 ══ -->
    <section class="collect-section space-y-4">
      <h2 class="text-sm font-semibold text-slate-700 border-b border-slate-100 pb-2 flex items-center gap-2">
        <span class="w-1 h-4 bg-amber-500 rounded-full"></span>保存状况与权属
      </h2>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm text-slate-600 mb-1">保存现状</label>
          <select id="preservation_status" name="preservation_status"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
            {% for value, label in preservation_status_choices %}
              <option value="{{ value }}" {% if value == "一般" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-600 mb-1">权属</label>
          <select id="ownership" name="ownership"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
            {% for value, label in ownership_choices %}
              <option value="{{ value }}" {% if value == "state" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm text-slate-600 mb-1">保护级别</label>
        <select id="protection_level" name="protection_level"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50">
          {% for value, label in protection_level_choices %}
            <option value="{{ value }}" {% if value == "DS" %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </section>

    <!-- ══ 卡片：文物简介 ══ -->
    <section class="collect-section space-y-3">
      <h2 class="text-sm font-semibold text-slate-700 border-b border-slate-100 pb-2 flex items-center gap-2">
        <span class="w-1 h-4 bg-purple-500 rounded-full"></span>文物简介
      </h2>
      <div>
        <label class="block text-sm text-slate-600 mb-1">破坏原因</label>
        <textarea id="damage_cause" name="damage_cause" rows="2" placeholder="（选填）"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50 resize-none"></textarea>
      </div>
      <div>
        <label class="block text-sm text-slate-600 mb-1">威胁因素</label>
        <textarea id="threat_factors" name="threat_factors" rows="2" placeholder="（选填）"
                  class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50 resize-none"></textarea>
      </div>
      <textarea id="description" name="description" rows="4"
                placeholder="对文物的历史背景、形制特征及现状进行描述（建议 100 字以上）"
                class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50 resize-none leading-relaxed"></textarea>
    </section>

    <!-- ══ 卡片：现场照片 ══ -->
    <section class="collect-section space-y-3">
      <h2 class="text-sm font-semibold text-slate-700 border-b border-slate-100 pb-2 flex items-center gap-2">
        <span class="w-1 h-4 bg-rose-500 rounded-full"></span>现场照片
        <span class="ml-auto text-xs font-normal text-slate-400">最多 10 张，按巡查上报同规则处理</span>
      </h2>

      <!-- 隐藏 file input -->
      <input id="photo-input" type="file" name="photos" accept="image/*" multiple capture="environment"
             class="hidden" onchange="handlePhotoSelect(this)" />

      <div id="photo-preview-area">
        <!-- 添加按钮 -->
        <div class="add-photo-btn" onclick="document.getElementById('photo-input').click()">
          <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
          </svg>
          <span>拍照/相册</span>
        </div>
      </div>

      <p id="photo-count" class="text-xs text-slate-400">已选 0 张</p>
      <p class="text-xs text-slate-400 leading-relaxed">
        💡 第一张照片将作为封面图。照片处理与巡查记录上报保持一致：
        按原图保存（请上传已带经纬度时间水印的照片）。
      </p>
    </section>

    <!-- ══ 采集单位提示 ══ -->
    <div data-layout-span="full" class="flex items-center gap-2 px-1 text-xs text-slate-500">
      <svg class="w-4 h-4 text-blue-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
      </svg>
      采集单位：<strong class="text-slate-700">{{ collect_unit }}</strong>
      （如需修改，请联系管理员在系统设置中更新 <code>HERITAGE_COLLECT_UNIT</code>）
    </div>

    <!-- ══ 提交按钮 ══ -->
    <button id="btn-submit" onclick="submitForm()" data-layout-span="full"
            class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold
                   text-base py-3.5 rounded-2xl shadow-md transition-colors flex items-center justify-center gap-2">
      <svg id="submit-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span id="submit-text">提交采集数据</span>
    </button>

  </main>

  <footer class="collect-version">
    系统版本 {{ SYS_VERSION }}
  </footer>

  <!-- ══ Toast ══ -->
  <div id="toast"></div>

  <!-- ══ 成功弹窗 ══ -->
  <div id="success-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-end justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl space-y-4 animate-bounce-in">
      <div class="flex flex-col items-center gap-3 text-center">
        <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center">
          <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-slate-800">采集成功！</h3>
        <p id="success-msg" class="text-sm text-slate-600 leading-relaxed"></p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button onclick="resetForm()" class="border border-slate-200 text-slate-600 text-sm py-2.5 rounded-xl hover:bg-slate-50">
          继续采集
        </button>
        <button onclick="goBack()" class="bg-blue-600 text-white text-sm py-2.5 rounded-xl hover:bg-blue-700">
          返回列表
        </button>
      </div>
    </div>
  </div>
  <script src="{% static 'public/js/heritage_collect.js' %}?v={{ SYS_VERSION }}"></script>
</body>
</html>
